name: Build and Deploy to Azure Container App

on:
  push:
    branches: [ "azure-dev" ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Must match the federated credential subject
    # repo:SonyaJane/dropped-kerb-mapper:environment:Production
    environment: Production
    permissions:
      id-token: write   # required for OIDC login to Azure
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: azure-dev

      - name: Log in to Azure (OIDC federated credential)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DA49A7D1762648B593ECA399C2CC295F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A284DB056A284F0C89CF6D9B33FC0776 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_77D85EE4B9444CB7AFD683A1B193ACE2 }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: droppedkerbmapper-f6cse9c6dzebewhj.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build Docker image
        # Tag with the commit SHA (and latest). The unique per-commit tag is what
        # forces Container Apps to create a new revision on deploy; reusing the
        # mutable :latest tag alone leaves the running revision unchanged.
        run: |
          docker build \
            -t droppedkerbmapper-f6cse9c6dzebewhj.azurecr.io/droppedkerbmapper:${{ github.sha }} \
            -t droppedkerbmapper-f6cse9c6dzebewhj.azurecr.io/droppedkerbmapper:latest .

      - name: Push Docker image
        run: |
          docker push droppedkerbmapper-f6cse9c6dzebewhj.azurecr.io/droppedkerbmapper:${{ github.sha }}
          docker push droppedkerbmapper-f6cse9c6dzebewhj.azurecr.io/droppedkerbmapper:latest

      - name: Install Azure Container Apps CLI extension
        run: az extension add --name containerapp --upgrade

      - name: Deploy Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: mobility-mapper-rg
          containerAppName: droppedkerbmapper-app
          imageToDeploy: droppedkerbmapper-f6cse9c6dzebewhj.azurecr.io/droppedkerbmapper:${{ github.sha }}
          registryUrl: droppedkerbmapper-f6cse9c6dzebewhj.azurecr.io
          registryUsername: ${{ secrets.ACR_USERNAME }}
          registryPassword: ${{ secrets.ACR_PASSWORD }}
