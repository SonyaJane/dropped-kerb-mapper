name: Dump Production DB

# One-off, manually-triggered workflow to back up the production PostgreSQL
# database on dropped-kerb-mapper-server. Logs into Azure via the existing
# service principal (no MFA), temporarily opens the firewall for the runner,
# dumps every user database, uploads them as an artifact, then closes the
# firewall again.

on:
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      RG: mobility-mapper-rg
      SERVER: dropped-kerb-mapper-server
      HOST: dropped-kerb-mapper-server.postgres.database.azure.com
      DB_USER: dkm_admin
    steps:
      - name: Log in to Azure (service principal)
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get runner public IP
        id: ip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Open firewall for runner
        run: |
          az postgres flexible-server firewall-rule create \
            --resource-group "$RG" \
            --name "$SERVER" \
            --rule-name ci-dump-temp \
            --start-ip-address "${{ steps.ip.outputs.ip }}" \
            --end-ip-address "${{ steps.ip.outputs.ip }}"

      - name: Install postgresql-client 16
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Dump all user databases
        env:
          PGPASSWORD: ${{ secrets.DKM_DB_PASSWORD }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          mkdir -p dumps
          DBS=$(psql -h "$HOST" -U "$DB_USER" -d postgres -At -c \
            "SELECT datname FROM pg_database WHERE datistemplate=false AND datname NOT IN ('postgres','azure_maintenance','azure_sys');")
          echo "Databases found:"; echo "$DBS"
          for db in $DBS; do
            echo "=== $db ==="
            psql -h "$HOST" -U "$DB_USER" -d "$db" -At \
              -c "SELECT 'reports=' || count(*) FROM mapper_report" 2>/dev/null || echo "(no mapper_report table)"
            pg_dump -h "$HOST" -U "$DB_USER" -d "$db" --no-owner --no-acl -Fc -f "dumps/${db}.dump"
            pg_dump -h "$HOST" -U "$DB_USER" -d "$db" --no-owner --no-acl -Fp -f "dumps/${db}.sql"
          done
          ls -lh dumps

      - name: Upload dumps artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-db-dumps
          path: dumps/
          retention-days: 7
          if-no-files-found: warn

      - name: Remove firewall rule
        if: always()
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group "$RG" \
            --name "$SERVER" \
            --rule-name ci-dump-temp --yes || true
